<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本机用量 · 视觉预览</title>
<style>
/* 内容区 < 600：4 列，页边距 16，列距 12。8 / 16 / 24 区分组件、条目、组。 */
:root {
  --s1:#fdfdfc; --s2:#f9f9f8; --s3:#f1f0ef; --s4:#e9e8e6; --s5:#e2e1de;
  --s6:#dad9d6; --s7:#cfceca; --s8:#bcbbb5; --s10:#82827c; --s11:#63635e; --s12:#21201c;
  --ink:var(--s12); --muted:var(--s11); --card:var(--s2); --well:var(--s3);
  --secondary:rgba(60,60,67,.6); --separator:rgba(60,60,67,.12); --track:rgba(120,120,128,.12);
  --warn:#ce2c31;
  --ci:#d8dce0; --cc:#30a46c; --co:#0d74ce;
  --font:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI",sans-serif;
  --margin:16px; --gutter:12px; --tight:8px; --item:16px; --group:24px;
  --window:400px;
  --ease:cubic-bezier(.2,.8,.2,1); --move:280ms;
  --r0:20px; --r1:8px; --r2:6px; --r3:4px;
}
[data-theme="dark"] {
  --s1:#111110; --s2:#191918; --s3:#222221; --s4:#2a2a28; --s5:#31312e;
  --s6:#3b3a37; --s7:#494844; --s8:#62605b; --s10:#7c7b74; --s11:#b5b3ad; --s12:#eeeeec;
  --warn:#ff9592;
  --secondary:rgba(235,235,245,.6); --separator:rgba(84,84,88,.65); --track:rgba(118,118,128,.24);
  --ci:#4a5058; --co:#70b8ff;
}
* { box-sizing:border-box; }
html, body { margin:0; }
body {
  min-height:100vh;
  background:#eceae4;
  color:var(--ink);
  font:12px/1.5 var(--font);
  font-variant-numeric:tabular-nums;
}
button, input { font:inherit; color:inherit; }
button { border:0; background:transparent; cursor:pointer; }
button:hover { background:var(--s4); }
button:active { background:var(--s5); }
:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
.stage { box-sizing:border-box; width:min(292px, 100%); max-width:100%; min-width:0; margin:0 auto; padding:32px 16px 48px; container-type:inline-size; }
.note { display:flex; align-items:flex-start; gap:var(--tight); margin:0 0 var(--group); color:var(--muted); font-size:10.5px; line-height:15px; }
.note button { flex:none; margin-left:auto; min-height:23px; padding:4px 8px; border-radius:var(--r2); color:var(--muted); font-size:10.5px; }
.panel {
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  column-gap:var(--gutter);
  width:100%;
  min-width:0;
  height:auto;
  max-height:calc(100dvh - 48px);
  padding:16px;
  border:0;
  border-radius:22px;
  background:#fdfdfc;
  box-shadow:0 1px 1px #0000000a, 0 12px 32px -18px #00000040;
  overflow:hidden;
  font-size:12px;
}
.panel > * { grid-column:1 / -1; min-width:0; }
.sheet { min-width:0; }
header.top { display:flex; align-items:center; gap:8px; min-height:28px; margin:0; padding:0; }
header.top h1 { margin:0; font-size:13px; font-weight:600; letter-spacing:-.01em; line-height:18px; }
header.top > svg { display:none; }
header.top .gear svg { display:block; color:var(--secondary); }
.head-actions { margin-left:auto; display:flex; align-items:center; gap:2px; }
header.top .gear, header.top .refresh { width:28px; height:28px; padding:4px; border-radius:8px; color:var(--secondary); }
header.top .refresh.busy svg { animation:spin 700ms linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.periods { position:relative; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); margin:12px 0 0; padding:2px; border-radius:9px; background:var(--track); }
.periods i.mark { display:block; position:absolute; z-index:0; top:2px; bottom:2px; left:2px; width:calc((100% - 4px) / 4); border-radius:7px; background:#fff; box-shadow:0 1px 1px #00000014, 0 3px 8px #0000001a; transition:transform 280ms var(--ease); }
.periods button { position:relative; z-index:1; height:28px; min-width:0; padding:0 2px; border-radius:7px; color:var(--ink); font-size:13px; font-weight:500; line-height:28px; background:transparent; }
.periods button:hover { background:transparent; }
.periods button[aria-pressed="true"] { font-weight:600; background:transparent; box-shadow:none; }
[data-theme="dark"] .periods i.mark { background:#636366; }
.range { display:none; }
.editor { display:grid; gap:8px; margin:16px 0 0; background:transparent; overflow:visible; }
.fields { border-radius:10px; background:var(--track); overflow:hidden; }
.dayline { margin:8px 0 0; color:#8a887f; font-size:11px; line-height:16px; }
.daily { margin:16px 0 0; }
.daily-h, .detail { display:none; }
.presets { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); margin:0; padding:2px; border-radius:9px; background:var(--track); }
.presets button { height:28px; border-radius:7px; color:var(--ink); font-size:13px; font-weight:500; line-height:28px; background:transparent; }
.presets button:hover { background:transparent; }
.presets button[aria-pressed="true"] { font-weight:600; background:#fff; box-shadow:0 1px 1px #00000014, 0 3px 8px #0000001a; }
[data-theme="dark"] .presets button[aria-pressed="true"] { background:#636366; }
.field { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:36px; margin:0; padding:0 10px; }
.field + .field { border-top:0.5px solid var(--separator); }
.field span { color:var(--ink); font-size:13px; }
.field b, .field .date { margin-left:auto; border:0; background:transparent; color:var(--secondary); font-size:13px; font-weight:400; text-align:right; }
.apply { display:flex; align-items:center; min-height:36px; margin:0; padding:0 10px; border-top:0.5px solid var(--separator); font-size:13px; }
.apply b { color:var(--secondary); font-weight:400; }
.apply button { margin-left:auto; padding:0; border-radius:8px; background:transparent; color:var(--ink); font-size:13px; font-weight:600; }
.apply button:hover { background:transparent; }
.field button[aria-expanded="true"] { background:transparent; color:var(--ink); font-weight:600; }
.cal { margin-top:8px; padding:8px; border:1px solid var(--s7); border-radius:var(--r1); background:var(--card); }
.cal-h { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.cal-h strong { font-size:12px; font-weight:600; letter-spacing:-.008em; line-height:18px; }
.cal-h button { width:28px; height:28px; border-radius:var(--r2); color:var(--muted); font-size:11.5px; }
.cal-f button { width:auto; min-width:28px; height:28px; padding:0 8px; border-radius:var(--r2); color:var(--muted); font-size:11.5px; white-space:nowrap; }
.cal-g { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px; }
.cal-g b, .cal-g button { height:28px; display:grid; place-items:center; border-radius:var(--r3); font-size:11.5px; font-weight:500; }
.cal-g b { color:var(--muted); font-weight:400; }
.cal-g button[data-other] { color:var(--muted); }
.cal-g button[aria-selected="true"] { background:var(--ink); color:var(--card); font-weight:600; }
.cal-f { display:flex; justify-content:space-between; align-items:center; margin-top:6px; padding-top:4px; border-top:1px solid var(--s6); }
.fine { margin-top:8px; }
.fine summary { display:flex; align-items:center; min-height:23px; padding:6px 0; color:var(--muted); font-size:10.5px; line-height:15px; cursor:pointer; list-style:none; }
.fine summary::-webkit-details-marker { display:none; }
.fine summary svg { margin-left:auto; }
.fine[open] summary svg { transform:rotate(90deg); }
.rail { position:relative; height:24px; margin:4px 0 0; }
.rail .track, .rail .fill { position:absolute; left:8px; right:8px; top:11px; height:2px; border-radius:99px; background:var(--s7); }
.rail .fill { background:var(--ink); }
.rail .thumb { position:absolute; left:0; top:4px; width:16px; height:16px; border:2px solid var(--card); border-radius:99px; background:var(--ink); box-shadow:0 1px 3px #00000040; }
.rail .thumb.end { left:auto; right:0; }

.reads { padding:16px 0 0; }
.eyebrow { margin:0; color:var(--secondary); font-size:12px; line-height:16px; }
.primary { margin:2px 0 0; text-align:left; font-size:32px; font-weight:700; line-height:1.05; letter-spacing:-.022em; }
.status { margin:4px 0 0; font-size:13px; line-height:18px; }
.status span { color:var(--secondary); font-weight:400; }
.status b { color:#248a3d; font-weight:600; }
.status.quiet { color:var(--secondary); font-weight:400; }
.meta { margin:2px 0 0; color:var(--secondary); font-size:12px; line-height:16px; }
.comp-line { margin-top:16px; }
.comp-key { display:flex; flex-wrap:wrap; gap:10px; margin:8px 0 0; color:var(--muted); font-size:11px; line-height:16px; }
.comp-key span { display:inline-flex; align-items:center; gap:4px; }
[data-theme="dark"] .status b { color:#30d158; }
.daily { margin:20px 0 0; }
.daily-h, .legend { display:flex; flex-wrap:wrap; align-items:center; gap:var(--tight); min-height:15px; color:var(--muted); font-size:10.5px; line-height:15px; }
.legend { margin-left:auto; gap:var(--tight); font-size:9.5px; line-height:14px; }
.sw { width:6px; height:6px; border-radius:99px; display:inline-block; flex:none; box-shadow:none; transform:translateY(.5px); }
.sw.in { background:var(--ci); box-shadow:inset 0 0 0 1px rgba(60,60,67,.45); }
[data-theme="dark"] .sw.in { box-shadow:inset 0 0 0 1px rgba(255,255,255,.35); }
.sw.cache { background:var(--cc); }
.sw.out { background:var(--co); }
.legend span { display:inline-flex; align-items:center; gap:var(--tight); }
.daily-h, .detail { display:none; }
.detail { display:none; flex-wrap:wrap; gap:var(--tight); align-items:baseline; min-height:27px; padding:var(--tight) 0 0; color:var(--muted); font-size:10.5px; line-height:15px; }
.detail b { color:var(--ink); font-size:10.5px; font-weight:600; }
.detail .money { margin-left:auto; }
.plot { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); height:64px; }
.day { display:flex; flex-direction:column; justify-content:flex-end; height:64px; padding:0 4px; border-radius:var(--r3); color:var(--muted); }
.day .rail { height:46px; margin:0; display:flex; align-items:flex-end; justify-content:center; border-bottom:0; }
.day .stack { width:14px; display:flex; flex-direction:column; justify-content:flex-end; border-radius:4px 4px 2px 2px; overflow:hidden; }
.day .stack i { display:block; flex:none; }
.day .stack .out { background:var(--co); }
.day .stack .cache { background:var(--cc); }
.day .stack .in { background:var(--ci); box-shadow:inset 0 0 0 1px var(--s8); }
.day[aria-pressed="true"] .stack { outline:none; }
.day .lbl { height:18px; line-height:18px; text-align:center; font-size:9px; }
.day[aria-pressed="true"] .lbl { color:var(--ink); font-weight:600; }
.day.future { pointer-events:none; }
.day.future .lbl { color:var(--s10); }
.day.future .rail { border-bottom-color:color-mix(in srgb, var(--s6) 45%, transparent); }
.day.empty .stub { width:100%; height:2px; background:repeating-linear-gradient(90deg, var(--s8) 0 2px, transparent 2px 4px); }
details.fold { margin-top:16px; border-top:1px solid var(--s6); }
details.fold + details.fold { margin-top:var(--item); }
details.fold summary { display:flex; align-items:center; gap:var(--tight); padding:var(--item) 0; color:var(--ink); font-size:11.5px; line-height:17.25px; cursor:pointer; list-style:none; }
details.fold summary::-webkit-details-marker { display:none; }
details.fold summary svg, .fine summary svg { margin-left:auto; color:var(--muted); transition:transform 180ms var(--ease); }
details.fold[open] summary svg { transform:rotate(90deg); }
.body { display:block; padding:0 0 var(--item); }
.comp { height:10px; margin:0; border-radius:99px; overflow:hidden; background:var(--track); }
.comp i.cache { display:block; height:100%; border-radius:99px; background:var(--cc); }
.kv { display:flex; justify-content:space-between; gap:var(--gutter); align-items:baseline; padding:var(--tight) 0; font-size:10.5px; line-height:15px; }
.kv span { display:flex; align-items:center; gap:var(--tight); color:var(--muted); }
.kv b { font-weight:600; }
.hit { margin-top:5px; padding-top:5px; }
.hit-l { display:flex; justify-content:space-between; margin-bottom:4px; color:var(--muted); font-size:10.5px; line-height:15px; }
.hit-l b { color:var(--ink); font-weight:600; }
.hit-t { height:3px; border-radius:2px; background:var(--s3); overflow:hidden; }
.hit-t i { display:block; height:100%; background:var(--cc); }
.model { padding:3px 0 4px; }
.model .track { height:3px; margin-top:3px; border-radius:2px; background:var(--s3); overflow:hidden; }
.model .track i { display:block; height:100%; min-width:2px; background:var(--ink); }
.settings { padding-top:0; }
.set-nav { grid-template-columns:repeat(3, minmax(0, 1fr)); }
.set-nav i.mark { width:calc((100% - 4px) / 3); }
.set-pane { margin-top:16px; }
.panel[data-page="settings"] :is(.periods:not(.set-nav), .sheet, .foot) { display:none; }
header.top .gear .back-icon { display:none; }
.panel[data-page="settings"] header.top .gear .gear-icon { display:none; }
.panel[data-page="settings"] header.top .gear .back-icon { display:block; }
.panel[data-page="settings"] .head-actions { margin-left:0; order:-1; }
.panel[data-page="settings"] #refresh { display:none; }
.set-h { margin:16px 2px 6px; color:var(--secondary); font-size:12px; font-weight:400; line-height:16px; }
.set-group { border-radius:10px; background:var(--track); overflow:visible; }
.plan { position:relative; }
.plan-value { display:inline-flex; align-items:center; gap:4px; }
.plan-value svg { color:var(--secondary); }
.plan-menu { position:absolute; z-index:4; top:calc(100% + 6px); right:0; width:max-content; padding:4px; border-radius:12px; background:#fdfdfc; box-shadow:0 1px 1px #0000000a, 0 12px 28px -12px #00000047; }
.plan-menu[hidden] { display:none; }
.plan-menu button { display:flex; align-items:center; justify-content:space-between; width:100%; min-height:32px; padding:0 10px; border-radius:8px; color:var(--ink); font-size:13px; font-weight:400; text-align:left; white-space:nowrap; }
.plan-menu button:hover { background:var(--track); }
.plan-menu button[aria-selected="true"]::after { content:""; width:5px; height:9px; margin-left:16px; border-right:1.6px solid var(--ink); border-bottom:1.6px solid var(--ink); transform:rotate(45deg) translateY(-1px); }
[data-theme="dark"] .plan-menu { background:#2a2a28; }
.panel.plan-open { overflow:visible; }
.set-row { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; min-height:36px; padding:0 10px; border-radius:0; color:var(--ink); font:inherit; font-size:13px; line-height:18px; text-align:left; text-decoration:none; }
.set-row + .set-row, .set-group > * + * { border-top:0.5px solid var(--separator); }
.set-row:hover, .set-row:hover { background:transparent; }
.set-row select, .set-row b, .set-row .gh, .threshold-field input { border:0; background:transparent; color:var(--secondary); font:inherit; font-size:13px; font-weight:400; text-align:right; }
.set-row .gh { flex:none; }
.set-row select { max-width:58%; }
.threshold-field { position:relative; display:flex; align-items:center; width:76px; }
.threshold-field input { width:100%; padding:0 16px 0 0; }
.threshold-field b { position:absolute; right:0; font-size:12px; }
.switch { position:relative; flex:none; width:40px; height:24px; }
.switch input { position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer; }
.switch i { display:block; width:40px; height:24px; border-radius:99px; background:#e9e9eb; }
.switch i::after { content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:99px; background:#fff; box-shadow:0 1px 2px #00000033; transition:transform 180ms var(--ease); }
.switch input:checked + i { background:#34c759; }
.switch input:checked + i::after { transform:translateX(16px); }
[data-theme="dark"] .switch i { background:#39393d; }
[data-theme="dark"] .switch input:checked + i { background:#30d158; }
.set-foot, .set-note { margin:6px 2px 0; color:var(--secondary); font-size:12px; line-height:16px; }
.set-note { margin-top:8px; }
.set-note summary { display:flex; align-items:center; min-height:28px; cursor:pointer; list-style:none; }
.set-note summary::-webkit-details-marker { display:none; }
.set-note p { margin:0 0 4px; }
#diagnosis { margin:8px 2px 0; color:var(--secondary); font:12px/16px ui-monospace, monospace; white-space:pre-wrap; }
#diagnosis:empty { display:none; }
footer.foot { display:flex; align-items:center; margin-top:12px; padding-top:8px; border-top:0.5px solid var(--separator); color:var(--secondary); font-size:12px; line-height:16px; }
footer.foot .ver { margin-left:auto; }
footer.foot button { display:none; }
html[data-type="large"] .panel { font-size:17px; }
html[data-type="large"] .primary { font-size:1.75em; }
html[data-type="large"] .secondary,
html[data-type="large"] .pair strong { font-size:1.125em; }
html[data-type="large"] :is(.k,.range,.log,.caveat,.detail,.kv,.hit-l,footer.foot,.daily-h) { font-size:0.875em; }
@container (min-width: 600px) {
  .panel { --margin:24px; --gutter:16px; grid-template-columns:repeat(8, minmax(0, 1fr)); }
  .pair { grid-column:1 / span 8; }
}
@container (min-width: 1024px) {
  .panel { --margin:32px; --gutter:24px; grid-template-columns:repeat(12, minmax(0, 1fr)); }
}
body, .panel, .periods, .editor, .presets, .field input, .cal, .comp, .hit-t, .model .track {
  transition: background-color 320ms var(--ease), color 320ms var(--ease), border-color 320ms var(--ease);
}
:is(.gear, .apply button, .field button, .cal-h button, .cal-f button) { transition: background-color 120ms var(--ease), color 120ms var(--ease), transform 100ms ease-out; }
:is(.gear, .apply button, .field button, .cal-h button, .cal-f button):active { transform: scale(.97); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
@media (prefers-reduced-transparency: reduce) {
  .panel { background:var(--s1, var(--card)); }
}
</style>
</head>
<body>
<main class="stage">
  <p class="note"><span>未接入控件</span><button type="button" id="theme">深色</button></p>
  <article class="panel" id="panel" aria-label="本机用量">
    <header class="top">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 13h12M4 11V8M8 11V5M12 11V7"/></svg>
      <h1 id="title">本机用量</h1>
      <div class="head-actions">
        <button class="gear" id="gear" type="button" aria-label="设置">
          <svg class="gear-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 5h3M8.5 5h5M2.5 11h5M10.5 11h3"/><circle cx="7" cy="5" r="1.5"/><circle cx="9" cy="11" r="1.5"/></svg>
          <svg class="back-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3.5 5.5 8 10 12.5"/></svg>
        </button>
        <button class="refresh" id="refresh" type="button" aria-label="刷新本机日志">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.46-3.54M11.54 1.75v2.71H8.75"/></svg>
        </button>
      </div>
    </header>
    <div class="periods" role="group" aria-label="区间">
      <i class="mark" id="mark" aria-hidden="true"></i>
      <button type="button" data-period="hour">10分钟</button>
      <button type="button" data-period="today" aria-pressed="true">今日</button>
      <button type="button" data-period="week">本周</button>
      <button type="button" data-period="custom">自选</button>
    </div>
    <div class="sheet" id="sheet">
      <div class="editor" id="editor" hidden></div>
      <p class="range" id="range"></p>
      <div class="reads" id="reads"></div>
      <div class="pair" id="pair"></div>
      <section class="daily" id="daily" hidden></section>
      <p class="dayline" id="dayline" hidden></p>
    </div>
    <section class="settings" id="settings" hidden>
      <div class="periods set-nav" id="set-nav" role="tablist" aria-label="设置分组">
        <i class="mark" id="set-mark"></i>
        <button type="button" data-set="alerts" aria-pressed="true">提醒</button>
        <button type="button" data-set="reference">参考</button>
        <button type="button" data-set="tools">维护</button>
      </div>
      <div class="set-pane" data-set-pane="alerts">
        <div class="set-group" role="group" aria-label="提醒">
          <label class="set-row"><span>低额度提醒</span><span class="switch"><input type="checkbox" name="alerts" checked><i></i></span></label>
          <label class="set-row" id="threshold-row"><span>提醒阈值</span><span class="threshold-field"><input id="thresholds" value="20, 10" inputmode="numeric" aria-label="提醒阈值，百分比，逗号分隔"><b>%</b></span></label>
          <label class="set-row"><span>额度恢复提醒</span><span class="switch"><input type="checkbox" name="recovery" checked><i></i></span></label>
          <label class="set-row" id="system-row"><span>系统通知</span><span class="switch"><input type="checkbox" name="system"><i></i></span></label>
        </div>
        <p class="set-foot" id="set-feedback" role="status"></p>
      </div>
      <div class="set-pane" data-set-pane="reference" hidden>
        <div class="set-group" aria-label="参考">
          <div class="plan" id="plan">
            <button class="set-row" id="plan-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span>参考套餐</span>
              <b class="plan-value"><span id="plan-label">Pro $200 · 20x</span><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 3.75 5 6.25 7.5 3.75" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></b>
            </button>
            <div class="plan-menu" id="plan-menu" role="listbox" hidden>
              <button type="button" role="option" data-plan="">选择套餐</button>
              <button type="button" role="option" data-plan="pro100">Pro $100</button>
              <button type="button" role="option" data-plan="pro200" aria-selected="true">Pro $200 · 20x</button>
              <button type="button" role="option" data-plan="pro500">Pro $500</button>
            </div>
          </div>
          <a class="set-row" href="https://modeldial.com/subscriptions?period=week&view=insights" target="_blank" rel="noopener noreferrer"><span>ModelDial</span><b>已核对 11-13</b></a>
          <a class="set-row" href="https://developers.openai.com/api/docs/pricing" target="_blank" rel="noopener noreferrer"><span>OpenAI 价格</span><b>2026.10.30</b></a>
        </div>
      </div>
      <div class="set-pane" data-set-pane="tools" hidden>
        <div class="set-group" aria-label="维护">
          <button class="set-row" id="doctor" type="button">运行自检</button>
          <button class="set-row" id="copy-diagnosis" type="button">复制诊断</button>
          <a class="set-row" href="https://github.com/DrFanghaiz/codex-usage-card/releases/latest" target="_blank" rel="noopener noreferrer" aria-label="当前 v3.0.2，在 GitHub 查看版本说明"><span>当前 v3.0.2</span><svg class="gh" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.68 7.68 0 0 1 8 4.84c.68.0 1.36.09 2 .26 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg></a>
        </div>
        <pre id="diagnosis"></pre>
      </div>
    </section>
    <footer class="foot"><span id="stamp">更新于 15:40</span><span class="ver">v3.0.2</span></footer>
  </article>
</main>
<script>
const $ = (id) => document.getElementById(id);
let sectionPeriod = "";
const periods = [...document.querySelectorAll("[data-period]")];
const days = [
  { name:"一", h:62, parts:[8,18,74], date:"11-09", label:"预览未附带该日数字" },
  { name:"二", h:36, parts:[8,14,78], date:"11-10", label:"预览未附带该日数字" },
  { name:"三", h:100, parts:[7,12,81], date:"11-11", label:"预览未附带该日数字" },
  { name:"四", empty:true, date:"11-12", label:"无记录" },
  { name:"五", h:48, parts:[8,16,76], date:"11-13", tok:"528万", cost:"$7.56", sel:true },
  { name:"六", future:true },
  { name:"日", future:true }
];
let period = "today";
let selected = 4;
let calendar = false;
let calField = "end";
let startDay = 13;
let endDay = 13;
let startTime = "00:00";
let endTime = "15:40";
let preset = "";

const views = {
  hour: {
    range:"11-13 15:30 — 11-13 15:40 · 示意",
    eyebrow:"近 10 分钟",
    primary:"≈ 0.04%",
    account:"—",
    caveat:"该区间采样不足",
    warn:true,
    log:"",
    token:"86万",
    cost:"≈ $1.20",
    mix:null
  },
  today: {
    range:"11-13 00:00 — 11-13 15:40",
    eyebrow:"今日 · 本机估算",
    primary:"≈ 0.23–0.8%",
    account:"+4.75",
    unit:"百分点",
    caveat:"含其他设备",
    log:"日志记录 34% · 账号未核验 · 00:10–15:40",
    token:"2,792.2万",
    cost:"≈ $41.60",
    mix:true
  },
  week: {
    range:"11-09 00:00 — 11-13 15:40",
    eyebrow:"本周",
    primary:"≈ 1.07%",
    account:"—",
    caveat:"该区间采样不足",
    warn:true,
    log:"",
    token:"2,508万",
    cost:"≈ $35.91",
    mix:true,
    daily:true
  },
  custom: {
    range:"11-13 00:00 — 11-13 15:40",
    eyebrow:"本机估算",
    primary:"≈ 0.23–0.8%",
    account:"+4.75",
    unit:"百分点",
    caveat:"含其他设备",
    log:"日志记录 34% · 账号未核验",
    token:"2,792.2万",
    cost:"≈ $41.60",
    mix:true,
    editor:true
  }
};

function figure(text) {
  return String(text).replaceAll("≈ ", "<span class=\"approx\">≈</span>");
}

function render() {
  const view = views[period];
  periods.forEach((button, index) => {
    const on = button.dataset.period === period;
    button.setAttribute("aria-pressed", String(on));
    if (on) $("mark").style.transform = `translateX(${index * 100}%)`;
  });
  $("editor").hidden = !view.editor;
  $("editor").innerHTML = view.editor ? editorHtml() : "";
  const number = String(view.primary).replace(/^≈\s*/, "");
  const status = view.account === "—"
    ? `<p class="status quiet">采样不足</p>`
    : `<p class="status"><span>账号</span> <b>${view.account} ${view.unit || ""}</b></p>`;
  const extra = view.account === "—" ? "" : (view.caveat ? `${view.caveat} · ` : "");
  const band = view.mix && !view.daily ? `<div class="comp-line"><div class="comp" aria-hidden="true"><i class="cache" style="width:90%"></i></div><p class="comp-key"><span><i class="sw in"></i>非缓存 7%</span><span><i class="sw cache"></i>缓存 90%</span><span><i class="sw out"></i>输出 3%</span></p></div>` : "";
  $("reads").innerHTML = `
    <p class="eyebrow">${view.eyebrow}</p>
    <p class="primary">${number}</p>
    ${status}
    <p class="meta">${extra}${view.token} · ${view.cost}</p>
    ${band}`;
  $("daily").hidden = !view.daily;
  $("daily").innerHTML = view.daily ? dailyHtml() : "";
  const day = days[selected];
  $("dayline").hidden = !view.daily;
  $("dayline").textContent = view.daily ? (day.tok ? `${day.name === "五" ? "周五" : day.date} ${day.tok} · ${day.cost}` : day.label) : "";
  $("stamp").textContent = "15:40 更新";
}

function editorHtml() {
  const weeks = ["一","二","三","四","五","六","日"];
  const picked = calField === "start" ? startDay : endDay;
  const cells = [];
  for (let day = 26; day <= 31; day++) cells.push(`<button type="button" data-other>${day}</button>`);
  for (let day = 1; day <= 30; day++) {
    const selectedDay = day === picked ? ` aria-selected="true"` : "";
    cells.push(`<button type="button" data-cal="${day}"${selectedDay}>${day}</button>`);
  }
  for (let day = 1; day <= 6; day++) cells.push(`<button type="button" data-other>${day}</button>`);
  const calendarHtml = `<div class="cal"><div class="cal-h"><button type="button" aria-label="上个月">‹</button><strong>2026年11月</strong><button type="button" aria-label="下个月">›</button></div><div class="cal-g">${weeks.map((day) => `<b>${day}</b>`).join("")}${cells.join("")}</div><div class="cal-f"><button type="button" id="cal-today">今天</button><button type="button" id="close-cal">关闭</button></div></div>`;
  const presets = [["30","30分","最近 30 分钟"],["60","1小时","最近一小时"],["180","3小时","最近 3 小时"],["300","5小时","最近 5 小时"]];
  const presetLabels = { "30":"30分钟", "60":"1小时", "180":"3小时", "300":"5小时" };
  const span = presetLabels[preset] || (startDay === 13 && endDay === 13 && startTime === "00:00" && endTime === "15:40" ? "15小时40分" : `11月${startDay}日 — 11月${endDay}日`);
  const row = (field, label, day, time) => `<div class="field"><span>${label}</span><button type="button" class="date" data-field="${field}" aria-expanded="${calendar && calField === field}" aria-label="${label}">11月${day}日 ${time}</button></div>`;
  return `
    <div class="presets" role="group" aria-label="快捷时长">${presets.map(([minutes, text, name]) => `<button type="button" data-minutes="${minutes}" aria-pressed="${preset === minutes}" aria-label="${name}">${text}</button>`).join("")}</div>
    <div class="fields">
      ${row("start","开始",startDay,startTime)}
      ${calendar && calField === "start" ? calendarHtml : ""}
      ${row("end","结束",endDay,endTime)}
      ${calendar && calField === "end" ? calendarHtml : ""}
      <div class="apply"><b>${span}</b><button type="button">应用</button></div>
    </div>`;
}

function calIcon() {
  return `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="3.5" width="11" height="10" rx="1.5"/><path d="M2.5 6.5h11M5.5 2.5v2M10.5 2.5v2"/></svg>`;
}

function dailyHtml() {
  const cols = days.map((day, index) => {
    if (day.future) return `<div class="day future"><span class="rail"></span><span class="lbl">${day.name}</span></div>`;
    const pressed = index === selected ? ` aria-pressed="true"` : "";
    const bar = Math.max(2, Math.round(46 * day.h / 100));
    const seg = (part) => Math.max(1, Math.round(bar * part / 100));
    const stack = day.empty ? `<i class="stub"></i>` : `<i class="out" style="height:${seg(day.parts[0])}px"></i><i class="in" style="height:${seg(day.parts[1])}px"></i><i class="cache" style="height:${seg(day.parts[2])}px"></i>`;
    return `<button type="button" class="day${day.empty ? " empty" : ""}" data-day="${index}"${pressed}><span class="rail"><span class="stack">${stack}</span></span><span class="lbl">${day.name}</span></button>`;
  }).join("");
  const day = days[selected];
  const mid = day.tok ? `<b>${day.tok}</b>` : day.label;
  const money = day.cost || "—";
  return `<div class="daily-h"><span>每日</span><div class="legend"><span><i class="sw in"></i>非缓存</span><span><i class="sw cache"></i>缓存</span><span><i class="sw out"></i>输出</span></div></div><div class="plot">${cols}</div><div class="detail"><span>${day.date}</span><span>${mid}</span><span class="money">${money}</span></div>`;
}

function mixHtml() {
  return `<div class="comp" aria-hidden="true"><i class="in" style="width:7.2%;background:var(--ci)"></i><i style="width:89.5%;background:var(--cc)"></i><i style="width:3.3%;background:var(--co)"></i></div>
    <div class="kv"><span><i class="sw in"></i>非缓存输入</span><b>200万</b></div>
    <div class="kv"><span><i class="sw cache"></i>缓存输入</span><b>2,500.1万</b></div>
    <div class="kv"><span><i class="sw out"></i>输出</span><b>92.03万</b></div>
    <div class="hit"><div class="hit-l"><span>缓存命中</span><b>92.6%</b></div><div class="hit-t"><i style="width:92.6%"></i></div></div>`;
}

function modelHtml() {
  const rows = [["GPT-6.1-sol","2,354万",100],["GPT-6-astra","438万",18.6],["GPT-6-sol","1,500万",63.7]];
  return rows.map(([name, value, width]) => `<div class="model"><div class="kv"><span>${name}</span><b>${value}</b></div><div class="track"><i style="width:${width}%"></i></div></div>`).join("");
}

document.querySelector(".periods").addEventListener("click", (event) => {
  const button = event.target.closest("[data-period]");
  if (!button || button.dataset.period === period) return;
  period = button.dataset.period;
  calendar = false;
  render();
});
$("panel").addEventListener("click", (event) => {
  const day = event.target.closest("[data-day]");
  if (day) {
    const next = Number(day.dataset.day);
    if (days[next] && !days[next].future && next !== selected) {
      selected = next;
      render();
    }
    return;
  }
  const field = event.target.closest("[data-field]");
  if (field) {
    const next = field.dataset.field;
    calendar = !(calendar && calField === next);
    calField = next;
    render();
    return;
  }
  const quick = event.target.closest("[data-minutes]");
  if (quick) {
    const times = { "30":["15:10","15:40"], "60":["14:40","15:40"], "180":["12:40","15:40"], "300":["10:40","15:40"] };
    preset = quick.dataset.minutes;
    [startTime, endTime] = times[preset];
    startDay = 13;
    endDay = 13;
    calendar = false;
    render();
    return;
  }
  const picked = event.target.closest("[data-cal]");
  if (picked) {
    const day = Number(picked.dataset.cal);
    if (calField === "start") startDay = day;
    else endDay = day;
    preset = "";
    calendar = false;
    render();
    return;
  }
  if (event.target.closest("#cal-today")) {
    if (calField === "start") startDay = 13;
    else endDay = 13;
    preset = "";
    calendar = false;
    render();
    return;
  }
  if (event.target.closest("#close-cal")) { calendar = false; render(); }
});
$("theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme !== "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("theme").textContent = dark ? "浅色" : "深色";
});
let page = "usage";
function showPage(next) {
  page = next;
  $("panel").dataset.page = next;
  $("settings").hidden = next !== "settings";
  $("title").textContent = next === "settings" ? "设置" : "本机用量";
  $("gear").setAttribute("aria-label", next === "settings" ? "返回" : "设置");
}
$("gear").addEventListener("click", () => showPage(page === "settings" ? "usage" : "settings"));
$("refresh").addEventListener("click", () => {
  const button = $("refresh");
  if (button.disabled) return;
  button.disabled = true;
  button.classList.add("busy");
  $("stamp").textContent = "刷新中";
  setTimeout(() => {
    button.disabled = false;
    button.classList.remove("busy");
    $("stamp").textContent = "刚刚";
  }, 700);
});
let setTab = "alerts";
function showSet(next) {
  setTab = next;
  document.querySelectorAll("[data-set]").forEach((button, index) => {
    const on = button.dataset.set === next;
    button.setAttribute("aria-pressed", String(on));
    if (on) $("set-mark").style.transform = `translateX(${index * 100}%)`;
  });
  document.querySelectorAll("[data-set-pane]").forEach((pane) => {
    pane.hidden = pane.dataset.setPane !== next;
  });
}
$("set-nav").addEventListener("click", (event) => {
  const button = event.target.closest("[data-set]");
  if (!button || button.dataset.set === setTab) return;
  showSet(button.dataset.set);
});
function syncSettings() {
  const alerts = document.querySelector('[name="alerts"]').checked;
  const recovery = document.querySelector('[name="recovery"]').checked;
  $("threshold-row").hidden = !alerts;
  $("system-row").hidden = !(alerts || recovery);
}
document.querySelectorAll(".switch input").forEach((input) => input.addEventListener("change", () => {
  syncSettings();
  $("set-feedback").textContent = input.name === "system" && !input.checked ? "系统通知未启用，卡内提醒仍可使用。" : "已保存";
}));
$("doctor").addEventListener("click", () => {
  $("diagnosis").textContent = "正在检查…";
  $("diagnosis").textContent = "启动任务: 未检查\n无窗口 Helper: 未检查\n调试连接: 未检查\n主页面: 未检查\n入口可见: 未检查\n预览未连接 Helper。";
});
$("copy-diagnosis").addEventListener("click", async () => {
  const text = $("diagnosis").textContent;
  if (!text || text === "正在检查…") { $("set-feedback").textContent = "请先运行自检"; return; }
  try { await navigator.clipboard.writeText(text); $("set-feedback").textContent = "已复制"; }
  catch { $("set-feedback").textContent = "复制失败，请选中文字手动复制。"; }
});
syncSettings();
const params = new URLSearchParams(location.search);
if (params.get("page") === "settings") showPage("settings");
if (["alerts", "reference", "tools"].includes(params.get("set"))) showSet(params.get("set"));
const planLabels = { "":"选择套餐", pro100:"Pro $100", pro200:"Pro $200 · 20x", pro500:"Pro $500" };
let planId = "pro200";
function setPlanOpen(open) {
  $("plan-menu").hidden = !open;
  $("plan-btn").setAttribute("aria-expanded", String(open));
  $("panel").classList.toggle("plan-open", open);
}
function choosePlan(id) {
  planId = id;
  $("plan-label").textContent = planLabels[id] || "选择套餐";
  document.querySelectorAll("[data-plan]").forEach((option) => {
    option.setAttribute("aria-selected", String(option.dataset.plan === id));
  });
  setPlanOpen(false);
}
$("plan-btn").addEventListener("click", (event) => {
  event.stopPropagation();
  setPlanOpen($("plan-menu").hidden);
});
$("plan-menu").addEventListener("click", (event) => {
  const option = event.target.closest("[data-plan]");
  if (!option) return;
  choosePlan(option.dataset.plan);
});
document.addEventListener("click", (event) => {
  if (!event.target.closest("#plan")) setPlanOpen(false);
});
if (params.get("planmenu") === "1") setPlanOpen(true);
if (views[params.get("view")]) period = params.get("view");
if (params.get("cal") === "1") calendar = true;
if (params.get("theme") === "dark") {
  document.documentElement.dataset.theme = "dark";
  $("theme").textContent = "浅色";
}
if (params.get("type") === "large") document.documentElement.dataset.type = "large";
const frame = Number(params.get("frame"));
if (frame >= 160 && frame <= 1200) document.querySelector(".stage").style.width = frame + "px";
render();
</script>
</body>
